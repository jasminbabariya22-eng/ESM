name: ESM CI Pipeline

on:
  push:
    branches:
      - deployment

  pull_request:
    branches:
      - deployment

jobs:
  build:
    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall app

      - name: Build Docker Image
        run: |
          docker build -t esm-api .